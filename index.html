<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DICT - SARO Funding & Procurement Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Custom styling and scrollbar overrides -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
        .dict-blue-gradient {
            background: linear-gradient(135deg, #0f3869 0%, #1e5296 100%);
        }
        .dict-accent-border {
            border-top: 4px solid #d97706;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white !important; color: black !important; }
            .shadow-xl, .shadow-md, .shadow-sm { box-shadow: none !important; }
        }
    </style>
</head>
<body class="min-h-screen antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Sample initial Philippine DICT Projects dataset
        const INITIAL_PROJECT_DATA = [
            {
                id: 'proj-1',
                code: 'DICT-PRJ-2024-01',
                title: 'Free Wi-Fi for All Program (FWFA)',
                division: 'ICT Infrastructure & Access Bureau',
                description: 'Provision of public internet access across public plazas, schools, and regional hubs.',
                targetBudget: 6000000,

            },
            {
                id: 'proj-2',
                code: 'DICT-PRJ-2024-02',
                title: 'National Cybersecurity Infrastructure & SOC Upgrade',
                division: 'Cybersecurity Bureau',
                description: 'Regional Security Operations Center establishment and threat prevention system.',
                targetBudget: 5000000,
                status: 'Ongoing'
            }
        ];

        // Sample initial Philippine DICT SARO dataset
        const INITIAL_SARO_DATA = [
            {
                id: 'saro-101',
                projectId: 'proj-1',
                saroNumber: 'SARO-BMB-A-24-0008492',
                particulars: 'Free Wi-Fi for All Program - Regional Public Key Infrastructure & Wi-Fi Deployment',
                dateIssued: '2024-02-15',
                remarks: 'Fund release under FY 2024 GAA for ICT Access and Connectivity Expansion.',
                objectCodes: [
                    {
                        id: 'obj-101-1',
                        code: '5-02-03-010-00',
                        particulars: 'Office & IT Supplies Expenses',
                        allocatedAmount: 450000,
                        remarks: 'Printing supplies, paper, toner, and small maintenance tools'
                    },
                    {
                        id: 'obj-101-2',
                        code: '5-06-04-010-00',
                        particulars: 'ICT Equipment & Access Point Routers',
                        allocatedAmount: 4200000,
                        remarks: 'Outdoor access points, fiber modems, and core network switches'
                    },
                    {
                        id: 'obj-101-3',
                        code: '5-02-11-990-00',
                        particulars: 'Other Professional Services (Field Engineers)',
                        allocatedAmount: 1350000,
                        remarks: 'Third-party installation labor and network audit services'
                    }
                ]
            },
            {
                id: 'saro-102',
                projectId: 'proj-2',
                saroNumber: 'SARO-BMB-A-24-0012058',
                particulars: 'National Cybersecurity System Upgrade & Regional Security Operations Center (SOC)',
                dateIssued: '2024-04-10',
                remarks: 'Special allocation for critical info-infrastructure protection.',
                objectCodes: [
                    {
                        id: 'obj-102-1',
                        code: '5-02-12-020-00',
                        particulars: 'Software Subscriptions & Firewall Licenses',
                        allocatedAmount: 3800000,
                        remarks: 'Enterprise threat detection, EDR, and SIEM licenses'
                    },
                    {
                        id: 'obj-102-2',
                        code: '5-02-05-030-00',
                        particulars: 'Internet Connectivity Services',
                        allocatedAmount: 950000,
                        remarks: 'Dedicated high-speed fiber leased lines for SOC nodes'
                    }
                ]
            }
        ];

        const INITIAL_UTILIZATION_DATA = [
            {
                id: 'util-201',
                saroId: 'saro-101',
                objectCodeId: 'obj-101-2',
                particulars: 'Procurement of Enterprise Grade Dual-Band Outdoor Wi-Fi APs (Batch 1)',
                quantity: 25,
                amount: 68000,
                total: 1700000,
                date: '2024-03-02',
                remarks: 'PO-2024-03-018 - Fully delivered and inspected at Central Hub'
            },
            {
                id: 'util-202',
                saroId: 'saro-101',
                objectCodeId: 'obj-101-1',
                particulars: 'Heavy Duty Inkjet Printers and Specialized Cabling Labels',
                quantity: 8,
                amount: 18500,
                total: 148000,
                date: '2024-03-12',
                remarks: 'OR-88201 for Field Deployment Teams'
            },
            {
                id: 'util-203',
                saroId: 'saro-102',
                objectCodeId: 'obj-102-1',
                particulars: 'Annual Subscription for Next-Gen Network Intrusion Prevention System',
                quantity: 1,
                amount: 1850000,
                total: 1850000,
                date: '2024-05-02',
                remarks: 'DV-2024-05-1044 Paid to System Integrator'
            }
        ];

        const INITIAL_PROCUREMENT_DATA = [
            {
                id: 'proc-301',
                saroId: 'saro-101',
                objectCodeId: 'obj-101-2',
                particulars: 'Procurement of Solar Power Backup Kits for Remote Access Points',
                quantity: 15,
                estimatedAmount: 42000,
                totalEstimated: 630000,
                status: 'In-Bidding / RFQ Stage',
                targetDate: '2024-09-30',
                remarks: 'BAC Resolution for Award pending technical evaluation'
            },
            {
                id: 'proc-302',
                saroId: 'saro-101',
                objectCodeId: 'obj-101-3',
                particulars: 'Contract for Fiber Optic Cable Splicing and Pole Attachment Verification',
                quantity: 1,
                estimatedAmount: 400000,
                totalEstimated: 400000,
                status: 'PR Prepared & Approved',
                targetDate: '2024-10-15',
                remarks: 'Market survey completed; PR submitted to Procurement Unit'
            },
            {
                id: 'proc-303',
                saroId: 'saro-102',
                objectCodeId: 'obj-102-2',
                particulars: 'Bandwidth Upgrade for Regional SOC Secondary Failover Line',
                quantity: 1,
                estimatedAmount: 350000,
                totalEstimated: 350000,
                status: 'Pre-Procurement Review',
                targetDate: '2024-11-01',
                remarks: 'Terms of Reference (TOR) under final review by Division Chief'
            }
        ];

        function App() {
            const [projects, setProjects] = useState(() => {
                const saved = localStorage.getItem('dict_project_list');
                return saved ? JSON.parse(saved) : INITIAL_PROJECT_DATA;
            });

            const [saros, setSaros] = useState(() => {
                const saved = localStorage.getItem('dict_saro_list');
                return saved ? JSON.parse(saved) : INITIAL_SARO_DATA;
            });

            const [utilizations, setUtilizations] = useState(() => {
                const saved = localStorage.getItem('dict_utilization_list');
                return saved ? JSON.parse(saved) : INITIAL_UTILIZATION_DATA;
            });

            const [procurements, setProcurements] = useState(() => {
                const saved = localStorage.getItem('dict_procurement_list');
                return saved ? JSON.parse(saved) : INITIAL_PROCUREMENT_DATA;
            });

            // Navigation state: 'dashboard' | 'projects' | 'saros' | 'utilizations' | 'procurements' | 'reports'
            const [activeTab, setActiveTab] = useState('dashboard');

            // Modals state
            const [showProjectModal, setShowProjectModal] = useState(false);
            const [showSaroModal, setShowSaroModal] = useState(false);
            const [showObjModal, setShowObjModal] = useState(false);
            const [showUtilModal, setShowUtilModal] = useState(false);
            const [showProcModal, setShowProcModal] = useState(false);

            // Toast message feedback
            const [toast, setToast] = useState(null);

            // Filter & Search states
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedProjectFilter, setSelectedProjectFilter] = useState('ALL');

            // Form States
            const [selectedSaroIdForObj, setSelectedSaroIdForObj] = useState('');

            // Save to LocalStorage
            useEffect(() => {
                localStorage.setItem('dict_project_list', JSON.stringify(projects));
            }, [projects]);

            useEffect(() => {
                localStorage.setItem('dict_saro_list', JSON.stringify(saros));
            }, [saros]);

            useEffect(() => {
                localStorage.setItem('dict_utilization_list', JSON.stringify(utilizations));
            }, [utilizations]);

            useEffect(() => {
                localStorage.setItem('dict_procurement_list', JSON.stringify(procurements));
            }, [procurements]);

            const showNotification = (msg, type = 'success') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3500);
            };

            // Formatting helper
            const formatCurrency = (val) => {
                return new Intl.NumberFormat('en-PH', {
                    style: 'currency',
                    currency: 'PHP',
                    minimumFractionDigits: 2
                }).format(val || 0);
            };

            // Calculate filtered SAROs based on project filter
            const filteredSaros = useMemo(() => {
                if (selectedProjectFilter === 'ALL') return saros;
                return saros.filter(s => s.projectId === selectedProjectFilter);
            }, [saros, selectedProjectFilter]);

            // Calculate overall system financial stats
            const financialSummary = useMemo(() => {
                let totalAllocated = 0;
                filteredSaros.forEach(s => {
                    s.objectCodes.forEach(obj => {
                        totalAllocated += Number(obj.allocatedAmount || 0);
                    });
                });

                const filteredSaroIds = new Set(filteredSaros.map(s => s.id));

                const totalUtilized = utilizations
                    .filter(u => filteredSaroIds.has(u.saroId))
                    .reduce((acc, curr) => acc + Number(curr.total || 0), 0);

                const totalUpcomingProcurement = procurements
                    .filter(p => filteredSaroIds.has(p.saroId))
                    .reduce((acc, curr) => acc + Number(curr.totalEstimated || 0), 0);

                const remainingBalance = totalAllocated - totalUtilized;
                const uncommittedBalance = remainingBalance - totalUpcomingProcurement;
                const utilizationPercentage = totalAllocated > 0 ? (totalUtilized / totalAllocated) * 100 : 0;

                return {
                    totalAllocated,
                    totalUtilized,
                    totalUpcomingProcurement,
                    remainingBalance,
                    uncommittedBalance,
                    utilizationPercentage
                };
            }, [filteredSaros, utilizations, procurements]);

            // Helper calculation per Project
            const getProjectMetrics = (projectId) => {
                const projSaros = saros.filter(s => s.projectId === projectId);
                let allocated = 0;
                projSaros.forEach(s => {
                    s.objectCodes.forEach(o => allocated += Number(o.allocatedAmount || 0));
                });

                const projSaroIds = new Set(projSaros.map(s => s.id));
                const utilized = utilizations.filter(u => projSaroIds.has(u.saroId)).reduce((sum, u) => sum + Number(u.total || 0), 0);
                const upcoming = procurements.filter(p => projSaroIds.has(p.saroId)).reduce((sum, p) => sum + Number(p.totalEstimated || 0), 0);

                const balance = allocated - utilized;
                const uncommitted = balance - upcoming;
                const percent = allocated > 0 ? (utilized / allocated) * 100 : 0;

                return { allocated, utilized, upcoming, balance, uncommitted, percent, saroCount: projSaros.length };
            };

            // Helper calculations per SARO
            const getSaroMetrics = (saroId) => {
                const saro = saros.find(s => s.id === saroId);
                if (!saro) return { allocated: 0, utilized: 0, upcoming: 0, balance: 0, uncommitted: 0, percent: 0 };

                let allocated = 0;
                saro.objectCodes.forEach(o => allocated += Number(o.allocatedAmount || 0));

                const saroUtilizations = utilizations.filter(u => u.saroId === saroId);
                const utilized = saroUtilizations.reduce((sum, u) => sum + Number(u.total || 0), 0);

                const saroProcurements = procurements.filter(p => p.saroId === saroId);
                const upcoming = saroProcurements.reduce((sum, p) => sum + Number(p.totalEstimated || 0), 0);

                const balance = allocated - utilized;
                const uncommitted = balance - upcoming;
                const percent = allocated > 0 ? (utilized / allocated) * 100 : 0;

                return { allocated, utilized, upcoming, balance, uncommitted, percent };
            };

            // Helper calculation per Object Code
            const getObjectCodeMetrics = (saroId, objectCodeId) => {
                const saro = saros.find(s => s.id === saroId);
                const obj = saro?.objectCodes.find(o => o.id === objectCodeId);
                if (!obj) return { allocated: 0, utilized: 0, upcoming: 0, balance: 0, uncommitted: 0, percent: 0 };

                const allocated = Number(obj.allocatedAmount || 0);

                const objUtilizations = utilizations.filter(u => u.saroId === saroId && u.objectCodeId === objectCodeId);
                const utilized = objUtilizations.reduce((sum, u) => sum + Number(u.total || 0), 0);

                const objProcurements = procurements.filter(p => p.saroId === saroId && p.objectCodeId === objectCodeId);
                const upcoming = objProcurements.reduce((sum, p) => sum + Number(p.totalEstimated || 0), 0);

                const balance = allocated - utilized;
                const uncommitted = balance - upcoming;
                const percent = allocated > 0 ? (utilized / allocated) * 100 : 0;

                return { allocated, utilized, upcoming, balance, uncommitted, percent };
            };

            // Delete Handlers
            const handleDeleteProject = (id) => {
                if (window.confirm("Are you sure you want to delete this Project? Assigned SAROs will become unassigned.")) {
                    setProjects(projects.filter(p => p.id !== id));
                    setSaros(saros.map(s => s.projectId === id ? { ...s, projectId: '' } : s));
                    showNotification("Project entry deleted successfully.", "info");
                }
            };

            const handleDeleteSaro = (id) => {
                if (window.confirm("Are you sure you want to delete this SARO fund download? All linked utilizations and upcoming procurements will also be removed.")) {
                    setSaros(saros.filter(s => s.id !== id));
                    setUtilizations(utilizations.filter(u => u.saroId !== id));
                    setProcurements(procurements.filter(p => p.saroId !== id));
                    showNotification("SARO entry deleted successfully.", "info");
                }
            };

            const handleDeleteObjectCode = (saroId, objId) => {
                if (window.confirm("Delete this Object Code allocation?")) {
                    setSaros(saros.map(s => {
                        if (s.id === saroId) {
                            return {
                                ...s,
                                objectCodes: s.objectCodes.filter(o => o.id !== objId)
                            };
                        }
                        return s;
                    }));
                    setUtilizations(utilizations.filter(u => !(u.saroId === saroId && u.objectCodeId === objId)));
                    setProcurements(procurements.filter(p => !(p.saroId === saroId && p.objectCodeId === objId)));
                    showNotification("Object code deleted.", "info");
                }
            };

            const handleAddMultipleObjectCodes = (saroId, newObjCodes) => {
                setSaros(saros.map(s => {
                    if (s.id === saroId) {
                        return {
                            ...s,
                            objectCodes: [...s.objectCodes, ...newObjCodes]
                        };
                    }
                    return s;
                }));
                showNotification(`${newObjCodes.length} Object Code(s) added to SARO!`, "success");
            };

            const handleDeleteUtilization = (id) => {
                setUtilizations(utilizations.filter(u => u.id !== id));
                showNotification("Utilization record removed.", "info");
            };

            const handleDeleteProcurement = (id) => {
                setProcurements(procurements.filter(p => p.id !== id));
                showNotification("Upcoming procurement item removed.", "info");
            };

            // Convert Procurement to Actual Utilization
            const handleConvertProcurementToUtil = (proc) => {
                const newUtil = {
                    id: 'util-' + Date.now(),
                    saroId: proc.saroId,
                    objectCodeId: proc.objectCodeId,
                    particulars: proc.particulars + ' (Converted from Procurement)',
                    quantity: proc.quantity,
                    amount: proc.estimatedAmount,
                    total: proc.totalEstimated,
                    date: new Date().toISOString().split('T')[0],
                    remarks: `Completed procurement. Original notes: ${proc.remarks || 'N/A'}`
                };

                setUtilizations([newUtil, ...utilizations]);
                setProcurements(procurements.filter(p => p.id !== proc.id));
                showNotification("Procurement item converted to actual Utilization expense!", "success");
            };

            // Reset demo data
            const handleResetData = () => {
                if (window.confirm("Reset all entries back to default DICT sample dataset?")) {
                    setProjects(INITIAL_PROJECT_DATA);
                    setSaros(INITIAL_SARO_DATA);
                    setUtilizations(INITIAL_UTILIZATION_DATA);
                    setProcurements(INITIAL_PROCUREMENT_DATA);
                    localStorage.removeItem('dict_project_list');
                    localStorage.removeItem('dict_saro_list');
                    localStorage.removeItem('dict_utilization_list');
                    localStorage.removeItem('dict_procurement_list');
                    showNotification("System data reset to default demo records.", "info");
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <header className="dict-blue-gradient text-white shadow-lg no-print">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                            <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                                <div className="flex items-center space-x-4">
                                    {/* DICT Logo */}
                                    <div className="bg-white p-2 rounded-lg shadow-sm flex items-center justify-center w-14 h-14 min-w-[3.5rem]">
                                        <img 
                                            src="https://upload.wikimedia.org/wikipedia/commons/8/86/Department_of_Information_and_Communications_Technology_%28DICT%29.svg" 
                                            alt="DICT Logo" 
                                            className="w-full h-full object-contain"
                                            onError={(e) => {
                                                e.target.onerror = null;
                                                e.target.src = "https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/Department_of_Information_and_Communications_Technology_%28DICT%29.svg/512px-Department_of_Information_and_Communications_Technology_%28DICT%29.svg.png";
                                            }}
                                        />
                                    </div>
                                    <div>
                                        <span className="text-xs font-bold uppercase tracking-widest text-blue-200">Republic of the Philippines</span>
                                        <h1 className="text-xl sm:text-2xl font-extrabold tracking-tight">DEPARTMENT OF INFORMATION AND COMMUNICATIONS TECHNOLOGY</h1>
                                        <p className="text-xs text-blue-100 font-medium">Project, SARO Funding, Utilization & Procurement Management System</p>
                                    </div>
                                </div>

                                <div className="flex items-center space-x-2">
                                    <button 
                                        onClick={handleResetData}
                                        className="text-xs bg-blue-900/60 hover:bg-blue-900 text-blue-100 border border-blue-400/30 px-3 py-2 rounded-lg transition-all flex items-center gap-1">
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                                        Reset Demo Data
                                    </button>
                                    <button 
                                        onClick={() => window.print()}
                                        className="text-xs bg-amber-600 hover:bg-amber-700 text-white font-semibold px-3 py-2 rounded-lg transition-all flex items-center gap-1 shadow-md">
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg>
                                        Print Report
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Sub Nav Tabs */}
                        <div className="bg-slate-900/40 border-t border-blue-800/50">
                            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex overflow-x-auto space-x-1 sm:space-x-4 py-2 custom-scrollbar">
                                {[
                                    { id: 'dashboard', label: 'Overview Dashboard', icon: 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6' },
                                    { id: 'projects', label: 'Projects Directory', icon: 'M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10' },
                                    { id: 'saros', label: 'SARO Funding Entries', icon: 'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z' },
                                    { id: 'utilizations', label: 'Utilized Funds & Ledger', icon: 'M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z' },
                                    { id: 'procurements', label: 'Upcoming Procurement', icon: 'M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z' },
                                    { id: 'reports', label: 'Fund Download Balance Sheet', icon: 'M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z' }
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`px-3 py-2 text-xs sm:text-sm font-semibold rounded-lg flex items-center space-x-2 whitespace-nowrap transition-all ${
                                            activeTab === tab.id
                                                ? 'bg-amber-500 text-slate-950 shadow-sm font-bold'
                                                : 'text-blue-100 hover:bg-blue-800/60 hover:text-white'
                                        }`}
                                    >
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d={tab.icon} />
                                        </svg>
                                        <span>{tab.label}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </header>

                    {/* Toast Notification */}
                    {toast && (
                        <div className="fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 border-l-4 border-amber-500 animate-bounce">
                            <span className="text-amber-400 font-bold">●</span>
                            <span className="text-sm font-medium">{toast.msg}</span>
                        </div>
                    )}

                    {/* Printable Header */}
                    <div className="hidden print-only p-6 text-center border-b-2 border-slate-900 mb-6">
                        <h1 className="text-xl font-bold uppercase">Department of Information and Communications Technology</h1>
                        <h2 className="text-lg font-semibold text-slate-700">Project, SARO Funding Release, Utilization & Procurement Statement</h2>

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
